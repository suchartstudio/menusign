<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Report - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ยำร่วมจิตร">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registered!'))
        .catch(err => console.log('Service Worker failed', err));
    });
  }
</script>
  <style>
    body { font-family: 'Mali', cursive; background: #eee; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .val { font-size: 3rem; color: #4CAF50; font-weight: bold; }
    .label { font-size: 1.2rem; color: #666; }
  </style>
</head>
<body>
  <h1>📊 รายงานยอดขาย</h1>
  <div class="box"><div class="label">ยอดขายวันนี้</div><div class="val" id="day">0</div></div>
  <div class="box"><div class="label">ยอดขายเดือนนี้</div><div class="val" id="month">0</div></div>
  <div class="box"><div class="label">ยอดขายรวมทั้งหมด</div><div class="val" id="total">0</div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function calc() {
    const q = query(collection(db, "orders"), where("status", "==", "completed"));
    const snap = await getDocs(q);
    let d=0, m=0, t=0;
    const now = new Date();
    snap.forEach(doc => {
      const o = doc.data(); const date = o.createdAt?.toDate();
      if(!date) return;
      t += o.total;
      if(date.toDateString() === now.toDateString()) d += o.total;
      if(date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear()) m += o.total;
    });
    document.getElementById('day').innerText = d.toLocaleString();
    document.getElementById('month').innerText = m.toLocaleString();
    document.getElementById('total').innerText = t.toLocaleString();
  }
  calc();
</script>
</body>
</html>
