<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ห้องครัว - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive; background: #263238; color: white; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; color: #333; border-radius: 15px; padding: 15px; position: relative; }
    .time { font-size: 0.8rem; color: #666; }
    ul { margin: 10px 0; padding-left: 20px; font-size: 1.2rem; }
    .done-btn { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; font-family: 'Mali'; }
  </style>
</head>
<body>
<h1>🔔 ออเดอร์เข้าใหม่ (Kitchen)</h1>
<button onclick="enableAudio()" id="audioBtn" style="background:#FF5722; color:white; border:none; padding:10px 20px; border-radius:10px; margin-bottom:20px;">🔊 เปิดระบบเสียงแจ้งเตือน</button>
<div class="grid" id="orderGrid"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, query, where, onSnapshot, updateDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let audioEnabled = false;

  window.enableAudio = () => { audioEnabled = true; document.getElementById('audioBtn').innerText = "🔊 ระบบเสียงพร้อมใช้งาน"; };

  function speak(txt) {
    if(!audioEnabled) return;
    const msg = new SpeechSynthesisUtterance("มีออเดอร์ใหม่ " + txt);
    msg.lang = 'th-TH'; window.speechSynthesis.speak(msg);
  }

  const q = query(collection(db, "orders"), where("status", "==", "pending"), orderBy("createdAt", "asc"));
  onSnapshot(q, (snap) => {
    const area = document.getElementById('orderGrid');
    area.innerHTML = '';
    snap.docChanges().forEach(change => { if(change.type === 'added') speak(change.doc.data().items.join(', ')); });
    snap.forEach(d => {
      const o = d.data();
      const div = document.createElement('div'); div.className = 'card';
      div.innerHTML = `
        <div class="time">สั่งเมื่อ: ${o.createdAt?.toDate().toLocaleTimeString() || 'เมื่อครู่'}</div>
        <ul>${o.items.map(i => `<li>${i}</li>`).join('')}</ul>
        <hr><div style="text-align:right; font-weight:bold; color:red; font-size:1.5rem; margin-bottom:10px;">${o.total}.-</div>
        <button class="done-btn" onclick="done('${d.id}')">เสร็จสิ้น / จ่ายเงินแล้ว</button>
      `;
      area.appendChild(div);
    });
  });

  window.done = async (id) => { await updateDoc(doc(db, "orders", id), { status: 'completed' }); };
</script>
</body>
</html>
