<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยำร่วมจิตร - Menu Display (By Category)</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #FF5722; 
      --secondary-color: #FFC107;
      --text-color: #222222;
      --bg-color: #FFFDF7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Mali', cursive;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      width: 100vw; height: 100vh;
    }
    .tv-container {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      padding: 2vw 4vw;
    }
    .category-header {
      height: 10vh;
      font-size: 4vw; font-weight: 700;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 4px dashed var(--secondary-color);
      margin-bottom: 2vh; padding: 0 1vw;
    }
    .category-left { color: var(--primary-color); }
    .shop-right {
      color: #2E7D32; font-size: 5vw;
      background: #C8E6C9; padding: 0.5vh 2vw;
      border-radius: 50px 15px 50px 15px; border: 3px solid #2E7D32;
    }
    .menu-list {
      flex-grow: 1; display: flex; flex-direction: column;
      justify-content: flex-start; gap: 2vh; padding-bottom: 2vh;
    }
    .menu-row {
      display: flex; align-items: center; height: 18vh;
      border-radius: 25px; padding: 0 2vw;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      animation: fadeIn 0.8s ease-in-out;
    }
    .bg-color-0 { background-color: #FFE082; border: 5px solid #FFB300; }
    .bg-color-1 { background-color: #B2DFDB; border: 5px solid #009688; }
    .bg-color-2 { background-color: #FFCCBC; border: 5px solid #FF5722; }
    .bg-color-3 { background-color: #C5CAE9; border: 5px solid #3F51B5; }
    
    .menu-img-wrapper {
      width: 16vh; height: 16vh; flex-shrink: 0;
      border-radius: 50%; border: 6px solid #FFF;
      overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background-color: #FFF;
    }
    .menu-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .menu-name {
      flex-grow: 1; font-size: 4.5vw; font-weight: 700;
      padding-left: 2vw; line-height: 1.5; display: flex; align-items: center;
    }
    .menu-price {
      font-size: 5.5vw; font-weight: 700; color: #E91E63;
      background: rgba(255, 255, 255, 0.8);
      padding: 0.5vh 2vw; border-radius: 15px; border: 3px dashed #E91E63;
    }
    .emoji-icon {
      font-size: 5vw; margin-right: 2vw; display: inline-block;
      animation: wiggle 1.5s infinite ease-in-out;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.2); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <div class="category-header">
      <div id="categoryName" class="category-left">กำลังโหลดข้อมูล...</div>
      <div class="shop-right">🏠 ยำร่วมจิตร</div>
    </div>
    <div class="menu-list" id="menuList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
      authDomain: "signage-eac53.firebaseapp.com",
      projectId: "signage-eac53",
      storageBucket: "signage-eac53.firebasestorage.app",
      messagingSenderId: "184834384558",
      appId: "1:184834384558:web:227f079ed8c161ca36c33f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let displayPages = []; // เก็บข้อมูลที่แบ่งเป็นหน้าๆ แล้ว
    let currentPageIndex = 0;
    const itemsPerPage = 4;
    const emojis = ['🍳', '🍲', '🍜', '🍛', '🍝', '🍕', '🍔', '🍟', '🍖', '🍤', '🥗', '🥘'];

    async function fetchMenus() {
      try {
        const querySnapshot = await getDocs(collection(db, "menus"));
        let rawData = [];
        querySnapshot.forEach((doc) => { rawData.push(doc.data()); });

        if(rawData.length > 0) {
          preparePages(rawData);
          renderDisplay();
          setInterval(renderDisplay, 10000); // สลับหน้าทุก 10 วินาที
        } else {
          document.getElementById('categoryName').innerText = "ยังไม่มีข้อมูลเมนู";
        }
      } catch (error) {
        document.getElementById('categoryName').innerText = "โหลดข้อมูลไม่สำเร็จ";
      }
    }

    // ฟังก์ชันจัดกลุ่มหมวดหมู่และแบ่งหน้า
    function preparePages(data) {
      // 1. จัดกลุ่มตามหมวดหมู่
      const grouped = data.reduce((acc, item) => {
        if (!acc[item.category]) acc[item.category] = [];
        acc[item.category].push(item);
        return acc;
      }, {});

      // 2. แบ่งรายการในแต่ละหมวดหมู่เป็นหน้าๆ (หน้าละ 4 รายการ)
      displayPages = [];
      Object.keys(grouped).forEach(catName => {
        const itemsInCat = grouped[catName];
        for (let i = 0; i < itemsInCat.length; i += itemsPerPage) {
          displayPages.push({
            category: catName,
            items: itemsInCat.slice(i, i + itemsPerPage)
          });
        }
      });
    }

    function renderDisplay() {
      const menuListDiv = document.getElementById('menuList');
      const categoryNameEl = document.getElementById('categoryName');
      
      if (displayPages.length === 0) return;
      
      const currentPage = displayPages[currentPageIndex];
      menuListDiv.innerHTML = ''; 
      categoryNameEl.innerText = `📁 ${currentPage.category}`;

      currentPage.items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = `menu-row bg-color-${index % 4}`;
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
        row.innerHTML = `
          <div class="menu-img-wrapper"><img src="${item.imageUrl}"></div>
          <div class="menu-name"><span class="emoji-icon">${randomEmoji}</span>${item.name}</div>
          <div class="menu-price">${item.price}.-</div>
        `;
        menuListDiv.appendChild(row);
      });

      // เลื่อนหน้าถัดไป
      currentPageIndex++;
      if (currentPageIndex >= displayPages.length) currentPageIndex = 0;
    }

    fetchMenus();
  </script>
</body>
</html>
