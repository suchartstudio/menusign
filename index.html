<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Menu Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tv-container">
    <div class="category-header" id="categoryName">กำลังโหลดข้อมูล...</div>
    <div class="menu-list" id="menuList"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
      authDomain: "signage-eac53.firebaseapp.com",
      projectId: "signage-eac53",
      storageBucket: "signage-eac53.firebasestorage.app",
      messagingSenderId: "184834384558",
      appId: "1:184834384558:web:227f079ed8c161ca36c33f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allMenus = [];
    let currentIndex = 0;
    const itemsPerPage = 4; // เปลี่ยนเป็น 4 รายการต่อหน้า
    const emojis = ['🍳', '🍲', '🍜', '🍛', '🍝', '🍕', '🍔', '🍟', '🍖', '🍤', '🥗', '🥘']; // ชุด Emoji อาหาร

    async function fetchMenus() {
      try {
        const querySnapshot = await getDocs(collection(db, "menus"));
        allMenus = [];
        querySnapshot.forEach((doc) => {
          allMenus.push(doc.data());
        });
        
        if(allMenus.length > 0) {
          renderDisplay();
          setInterval(renderDisplay, 10000); 
        } else {
          document.getElementById('categoryName').innerText = "ยังไม่มีข้อมูลเมนู";
        }
      } catch (error) {
        document.getElementById('categoryName').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
      }
    }

    function renderDisplay() {
      const menuListDiv = document.getElementById('menuList');
      if (!menuListDiv) return; 

      menuListDiv.innerHTML = ''; 
      const currentItems = allMenus.slice(currentIndex, currentIndex + itemsPerPage);
      
      if(currentItems.length > 0) {
        document.getElementById('categoryName').innerText = `หมวดหมู่: ${currentItems[0].category}`;
      }

      currentItems.forEach((item, index) => {
        const row = document.createElement('div');
        // สลับสีพื้นหลัง 0 ถึง 3 ตาม Index
        const colorClass = `bg-color-${index % 4}`;
        // สุ่มหยิบ Emoji 1 ตัวมาแสดง
        const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

        row.className = `menu-row ${colorClass}`;
        row.innerHTML = `
          <div class="menu-img-wrapper">
            <img src="${item.imageUrl}" alt="${item.name}">
          </div>
          <div class="menu-name">
            <span class="emoji-icon">${randomEmoji}</span>
            ${item.name}
          </div>
          <div class="menu-price">${item.price}.-</div>
        `;
        menuListDiv.appendChild(row);
      });

      currentIndex += itemsPerPage;
      if (currentIndex >= allMenus.length) {
        currentIndex = 0; 
      }
    }

    fetchMenus();
  </script>
</body>
</html>
