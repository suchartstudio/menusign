<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยำร่วมจิตร - จอแสดงผลรวม</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --primary: #FF5722; --shop-bg: #2E7D32; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Mali', cursive; background-color: #FFFDE7; overflow: hidden; height: 100vh; display: flex; }

    /* คอลัมน์ซ้าย: เมนู (75% ของจอ) */
    .menu-side { width: 75%; height: 100vh; padding: 2vh 2vw; display: flex; flex-direction: column; }
    
    /* คอลัมน์ขวา: ออเดอร์ (25% ของจอ) */
    .order-side { 
      width: 25%; height: 100vh; background: #37474F; 
      color: white; padding: 2vh 1vw; border-left: 6px solid var(--primary);
    }

    /* สไตล์เมนู (เหมือนเดิม) */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2vh; border-bottom: 6px dotted var(--primary); padding-bottom: 1vh; }
    .shop-name { color: #fff; background: var(--shop-bg); padding: 0.5vh 2vw; border-radius: 50px; font-weight: 700; font-size: 3vw; }
    .menu-row { display: flex; align-items: center; height: 17vh; border-radius: 30px; padding: 0 2vw; background: white; margin-bottom: 1.5vh; border: 4px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.1); }
    .menu-img { width: 14vh; height: 14vh; border-radius: 50%; object-fit: cover; border: 4px solid #FFC107; }
    .menu-name { flex-grow: 1; font-size: 3.5vw; font-weight: 700; padding-left: 2vw; }
    .menu-price { font-size: 4vw; font-weight: 700; color: #E91E63; }

    /* สไตล์ออเดอร์ด้านข้าง */
    .order-title { font-size: 2vw; margin-bottom: 1.5vh; color: #FFEB3B; font-weight: 700; border-bottom: 2px solid #555; padding-bottom: 5px; }
    .order-card { background: #455A64; padding: 1.5vh; border-radius: 15px; margin-bottom: 1.5vh; font-size: 1.5vw; }
    .order-item-list { list-style: none; margin-top: 5px; font-weight: 600; color: #E0E0E0; }
  </style>
</head>
<body>

  <div class="menu-side">
    <div class="header">
      <div id="categoryName" style="font-size: 3.5vw; font-weight: 700; color: var(--primary);">กำลังโหลด...</div>
      <div class="shop-name">🏠 ยำร่วมจิตร</div>
    </div>
    <div id="menuList"></div>
  </div>

  <div class="order-side">
    <div class="order-title">🔔 กำลังปรุง</div>
    <div id="sideOrderList"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = { /* ...ใส่ Config เดิม... */ };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 1. ระบบดึงเมนู (เหมือนเดิม)
  let pages = []; let curIndex = 0;
  async function fetchMenu() {
    const snap = await getDocs(collection(db, "menus"));
    let all = []; snap.forEach(d => all.push(d.data()));
    pages = []; // ปรับกลุ่มข้อมูลให้แสดงทีละ 4 รายการ
    for(let i=0; i<all.length; i+=4) pages.push(all.slice(i, i+4));
    setInterval(renderMenu, 8000); renderMenu();
  }
  function renderMenu() {
    const list = document.getElementById('menuList');
    list.innerHTML = pages[curIndex].map(m => `
      <div class="menu-row">
        <img src="${m.imageUrl}" class="menu-img">
        <div class="menu-name">${m.name}</div>
        <div class="menu-price">${m.price}.-</div>
      </div>
    `).join('');
    document.getElementById('categoryName').innerText = "📋 เมนูแนะนำ & รายการ";
    curIndex = (curIndex + 1) % pages.length;
  }

  // 2. ระบบออเดอร์ด้านข้าง
  onSnapshot(query(collection(db, "orders"), where("status", "==", "pending"), orderBy("createdAt", "asc")), (snap) => {
    const side = document.getElementById('sideOrderList');
    side.innerHTML = '';
    snap.forEach(d => {
      const o = d.data();
      side.innerHTML += `
        <div class="order-card">
          <div>🕒 ${o.createdAt?.toDate().toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</div>
          <ul class="order-item-list">${o.items.map(i => `<li>• ${i}</li>`).join('')}</ul>
        </div>
      `;
    });
  });

  fetchMenu();
</script>
</body>
</html>
