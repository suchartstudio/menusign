<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>TV Menu - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #FF5722; --secondary: #FFC107; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Mali', cursive; background: #FFFDF7; overflow: hidden; width: 100vw; height: 100vh; }
    .tv-container { padding: 2vw 4vw; height: 100%; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 5px dashed var(--secondary); margin-bottom: 2vh; padding-bottom: 1vh; }
    .shop-name { background: #C8E6C9; color: #2E7D32; padding: 1vh 3vw; border-radius: 50px; font-size: 5vw; border: 4px solid #2E7D32; }
    .category-name { font-size: 4vw; color: var(--primary); }
    .menu-grid { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .menu-card { display: flex; align-items: center; height: 18vh; border-radius: 30px; padding: 0 2vw; box-shadow: 0 10px 20px rgba(0,0,0,0.1); animation: slideIn 0.8s; border: 5px solid #ddd; }
    .bg-0 { background: #FFE082; border-color: #FFB300; } .bg-1 { background: #B2DFDB; border-color: #009688; }
    .bg-2 { background: #FFCCBC; border-color: #FF5722; } .bg-3 { background: #C5CAE9; border-color: #3F51B5; }
    .img-box { width: 15vh; height: 15vh; border-radius: 50%; border: 5px solid white; overflow: hidden; background: white; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex-grow: 1; padding-left: 3vw; font-size: 4.5vw; }
    .price { font-size: 5.5vw; color: #E91E63; background: white; padding: 0 2vw; border-radius: 20px; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-100px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>
<div class="tv-container">
  <div class="header">
    <div class="category-name" id="catLabel">กำลังโหลด...</div>
    <div class="shop-name">🏠 ยำร่วมจิตร</div>
  </div>
  <div class="menu-grid" id="menuArea"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let pages = []; let cur = 0;

  async function start() {
    const snap = await getDocs(collection(db, "menus"));
    let all = []; snap.forEach(d => all.push(d.data()));
    
    // จัดกลุ่ม: เมนูแนะนำขึ้นก่อน ตามด้วยหมวดหมู่อื่นๆ
    let groups = { "🌟 เมนูแนะนำ": all.filter(m => m.isRecommended) };
    all.forEach(m => { if(!groups[m.category]) groups[m.category] = []; groups[m.category].push(m); });

    Object.keys(groups).forEach(cat => {
      const items = groups[cat];
      for(let i=0; i<items.length; i+=4) {
        pages.push({ cat, list: items.slice(i, i+4) });
      }
    });

    render(); setInterval(render, 10000);
  }

  function render() {
    if(!pages.length) return;
    const p = pages[cur];
    document.getElementById('catLabel').innerText = `📁 ${p.cat}`;
    const area = document.getElementById('menuArea');
    area.innerHTML = p.list.map((m, i) => `
      <div class="menu-card bg-${i}">
        <div class="img-box"><img src="${m.imageUrl}"></div>
        <div class="info">${m.name}</div>
        <div class="price">${m.price}.-</div>
      </div>
    `).join('');
    cur = (cur + 1) % pages.length;
  }
  start();
</script>
</body>
</html>
