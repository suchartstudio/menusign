<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Menu Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- โครงสร้าง HTML ที่จำเป็นสำหรับแสดงผลบนจอ -->
  <div class="tv-container">
    <div class="category-header" id="categoryName">กำลังโหลดข้อมูล...</div>
    <div class="menu-list" id="menuList">
      <!-- ข้อมูลเมนูจะถูกนำมาใส่ตรงนี้อัตโนมัติ -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Firebase Configuration ของคุณ
    const firebaseConfig = {
      apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
      authDomain: "signage-eac53.firebaseapp.com",
      projectId: "signage-eac53",
      storageBucket: "signage-eac53.firebasestorage.app",
      messagingSenderId: "184834384558",
      appId: "1:184834384558:web:227f079ed8c161ca36c33f"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allMenus = [];
    let currentIndex = 0;
    const itemsPerPage = 5;

    async function fetchMenus() {
      try {
        const querySnapshot = await getDocs(collection(db, "menus"));
        allMenus = [];
        querySnapshot.forEach((doc) => {
          allMenus.push(doc.data());
        });
        
        const categoryNameEl = document.getElementById('categoryName');
        
        if(allMenus.length > 0) {
          renderDisplay();
          setInterval(renderDisplay, 10000); // สลับหน้าจอทุกๆ 10 วินาที
        } else {
          if(categoryNameEl) categoryNameEl.innerText = "ยังไม่มีข้อมูลเมนู";
        }
      } catch (error) {
        console.error("Error fetching menus: ", error);
        const categoryNameEl = document.getElementById('categoryName');
        if(categoryNameEl) categoryNameEl.innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
      }
    }

    function renderDisplay() {
      const menuListDiv = document.getElementById('menuList');
      const categoryNameEl = document.getElementById('categoryName');
      
      // ป้องกัน Error กรณีหา HTML ไม่เจอ
      if (!menuListDiv) return; 

      menuListDiv.innerHTML = ''; 
      
      const currentItems = allMenus.slice(currentIndex, currentIndex + itemsPerPage);
      
      if(currentItems.length > 0 && categoryNameEl) {
        categoryNameEl.innerText = `หมวดหมู่: ${currentItems[0].category}`;
      }

      currentItems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'menu-row';
        row.innerHTML = `
          <div class="menu-img-wrapper">
            <img src="${item.imageUrl}" alt="${item.name}">
          </div>
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">${item.price}.-</div>
        `;
        menuListDiv.appendChild(row);
      });

      currentIndex += itemsPerPage;
      if (currentIndex >= allMenus.length) {
        currentIndex = 0; 
      }
    }

    // เริ่มการดึงข้อมูล
    fetchMenus();
  </script>
</body>
</html>
