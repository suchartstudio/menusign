<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive; margin: 0; background: #FFFDF7; padding-bottom: 110px; }
    .header { background: #FF5722; color: white; padding: 15px; text-align: center; font-size: 1.6rem; font-weight: 700; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .section-title { padding: 20px 10px 5px; color: #FF5722; font-weight: 700; font-size: 1.3rem; border-bottom: 2px solid #FFCCBC; margin: 0 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px 10px; }
    .item { 
      text-align: center; background: white; padding: 12px 5px; border-radius: 20px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.05); border: 3px solid transparent; transition: 0.3s;
    }
    .item.selected { background: #E8F5E9; border-color: #4CAF50; }
    .item img { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 4px solid #FFC107; }
    .item.selected img { border-color: #4CAF50; }
    .item .name { font-size: 0.9rem; margin-top: 8px; font-weight: 700; height: 2.4em; overflow: hidden; line-height: 1.2; }
    .price { color: #E91E63; font-weight: 700; font-size: 1.1rem; margin: 5px 0; }
    .btn-add { background: #4CAF50; color: white; border: none; padding: 4px 15px; border-radius: 20px; font-family: 'Mali'; font-weight: 700; font-size: 0.8rem; }

    /* แถบตะกร้าสินค้าแบบใหม่: สีเขียวเข้ม ตัวหนังสือหนายักษ์ */
    .cart-bar { 
      position: fixed; bottom: 0; width: 100%; 
      background: #1B5E20; /* สีเขียวเข้ม */
      padding: 15px 20px; 
      box-shadow: 0 -5px 20px rgba(0,0,0,0.2); 
      display: flex; justify-content: space-between; align-items: center; 
      box-sizing: border-box; color: white;
    }
    .cart-info { font-weight: 700; font-size: 1.2rem; line-height: 1.2; }
    .cart-info b { font-size: 1.8rem; color: #FFEB3B; } /* ยอดเงินสีเหลืองสด */

    /* ปุ่มสั่งส้มสด ใหญ่เต็มตา */
    .order-now { 
      background: #FF5722; color: white; border: 4px solid #fff; 
      padding: 12px 25px; border-radius: 50px; 
      font-family: 'Mali'; font-weight: 800; font-size: 1.3rem; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="header">🏠 ยำร่วมจิตร</div>
<div id="content"></div>

<div class="cart-bar">
  <div class="cart-info">
    รวม <span id="cCount">0</span> รายการ<br>
    ยอด <b><span id="cSum">0</span>.-</b>
  </div>
  <button class="order-now" onclick="sendOrder()">สั่งเลย 🚀</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let cart = [];

  async function load() {
    const snap = await getDocs(collection(db, "menus"));
    let all = []; snap.forEach(d => all.push({ ...d.data(), id: d.id }));
    let html = '';
    
    const recs = all.filter(m => m.isRecommended);
    if(recs.length) {
      html += '<div class="section-title">🌟 เมนูแนะนำ</div><div class="grid">';
      recs.forEach(m => html += itemUI(m));
      html += '</div>';
    }

    let cats = [...new Set(all.map(m => m.category))];
    cats.forEach(c => {
      html += `<div class="section-title">📁 ${c}</div><div class="grid">`;
      all.filter(m => m.category === c).forEach(m => html += itemUI(m));
      html += '</div>';
    });
    document.getElementById('content').innerHTML = html;
  }

  function itemUI(m) {
    return `<div class="item" id="it-${m.id}" onclick="add('${m.id}','${m.name}', ${m.price})">
      <img src="${m.imageUrl}">
      <div class="name">${m.name}</div>
      <div class="price">${m.price}.-</div>
      <button class="btn-add">สั่ง</button>
    </div>`;
  }

  window.add = (id, n, p) => {
    cart.push({n, p});
    document.getElementById('cCount').innerText = cart.length;
    document.getElementById('cSum').innerText = cart.reduce((a, b) => a + b.p, 0).toLocaleString();
    document.querySelectorAll(`[id="it-${id}"]`).forEach(el => el.classList.add('selected'));
  };

  window.sendOrder = async () => {
    if(!cart.length) return alert("เลือกอาหารก่อนนะจ๊ะ");
    const btn = document.querySelector('.order-now');
    btn.disabled = true; btn.innerText = "ส่งแล้ว...";
    try {
      await addDoc(collection(db, "orders"), {
        items: cart.map(i => i.n),
        total: cart.reduce((a, b) => a + b.p, 0),
        status: 'pending',
        createdAt: serverTimestamp()
      });
      alert("ส่งออเดอร์แล้วจ้า 🙏");
      cart = []; document.getElementById('cCount').innerText="0"; document.getElementById('cSum').innerText="0";
      document.querySelectorAll('.item.selected').forEach(el => el.classList.remove('selected'));
    } catch (e) { alert(e.message); }
    btn.disabled = false; btn.innerText = "สั่งเลย 🚀";
  };
  load();
</script>
</body>
</html>
