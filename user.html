<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive; margin: 0; background: #f8f9fa; padding-bottom: 80px; }
    .header { background: #FF5722; color: white; padding: 15px; text-align: center; font-size: 1.5rem; position: sticky; top: 0; z-index: 10; }
    .section-title { padding: 15px 10px 5px; color: #FF5722; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
    .item { text-align: center; background: white; padding: 10px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .item img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #FFC107; }
    .item div { font-size: 0.8rem; margin-top: 5px; height: 2.4em; overflow: hidden; }
    .price { color: #E91E63; font-weight: bold; font-size: 0.9rem; }
    .cart-btn { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
    .order-now { background: #FF5722; color: white; border: none; padding: 10px 25px; border-radius: 30px; font-weight: bold; }
  </style>
</head>
<body>
<div class="header">🏠 ยำร่วมจิตร</div>
<div id="content"></div>
<div class="cart-btn">
  <div>รวม <b id="cCount">0</b> รายการ: <b id="cSum" style="color:#E91E63">0</b>.-</div>
  <button class="order-now" onclick="sendOrder()">สั่งเลย 🚀</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let cart = [];

  async function load() {
    const snap = await getDocs(collection(db, "menus"));
    let all = []; snap.forEach(d => all.push(d.data()));
    let html = '<div class="section-title">🌟 เมนูแนะนำ</div><div class="grid">';
    all.filter(m => m.isRecommended).forEach(m => html += itemUI(m));
    html += '</div>';

    let cats = [...new Set(all.map(m => m.category))];
    cats.forEach(c => {
      html += `<div class="section-title">📁 ${c}</div><div class="grid">`;
      all.filter(m => m.category === c).forEach(m => html += itemUI(m));
      html += '</div>';
    });
    document.getElementById('content').innerHTML = html;
  }

  function itemUI(m) {
    return `<div class="item" onclick="add('${m.name}', ${m.price})">
      <img src="${m.imageUrl}">
      <div>${m.name}</div>
      <div class="price">${m.price}.-</div>
    </div>`;
  }

  window.add = (n, p) => {
    cart.push({n, p});
    document.getElementById('cCount').innerText = cart.length;
    document.getElementById('cSum').innerText = cart.reduce((a, b) => a + b.p, 0);
  };

  window.sendOrder = async () => {
    if(!cart.length) return alert("เลือกอาหารก่อนจ้า");
    await addDoc(collection(db, "orders"), {
      items: cart.map(i => i.n),
      total: cart.reduce((a, b) => a + b.p, 0),
      status: 'pending',
      createdAt: serverTimestamp()
    });
    alert("สั่งแล้วจ้า! รอแป๊บน้า"); cart = []; location.reload();
  };
  load();
</script>
</body>
</html>
