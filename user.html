<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive; margin: 0; background: #f8f9fa; padding-bottom: 90px; }
    .header { background: #FF5722; color: white; padding: 15px; text-align: center; font-size: 1.5rem; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .section-title { padding: 15px 10px 5px; color: #FF5722; font-weight: bold; font-size: 1.1rem; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
    
    /* สไตล์ป้ายเมนูปกติ */
    .item { 
      text-align: center; background: white; padding: 10px 5px; border-radius: 15px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 2px solid transparent;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    /* สไตล์ป้ายเมนูเมื่อถูกเลือก */
    .item.selected { 
      background: #E8F5E9; /* สีเขียวอ่อนมาก */
      border-color: #4CAF50; /* ขอบสีเขียว */
      box-shadow: 0 4px 10px rgba(76, 175, 80, 0.2);
    }

    .item img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #FFC107; transition: border-color 0.3s; }
    .item.selected img { border-color: #4CAF50; }

    .item div.name { font-size: 0.8rem; margin-top: 5px; height: 2.4em; overflow: hidden; line-height: 1.2; font-weight: 600; }
    .price { color: #E91E63; font-weight: bold; font-size: 0.9rem; margin-bottom: 5px; }

    /* ปุ่มสั่งซื้อเล็กๆ สีเขียว */
    .btn-add-small {
      background: #4CAF50; color: white; border: none; padding: 3px 12px;
      border-radius: 20px; font-size: 0.75rem; font-family: 'Mali';
      font-weight: bold; cursor: pointer; display: inline-block;
    }
    .item.selected .btn-add-small { background: #2E7D32; }

    .cart-btn { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
    .order-now { background: #FF5722; color: white; border: none; padding: 10px 25px; border-radius: 30px; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(255, 87, 34, 0.3); }
    
    #cSum { color: #E91E63; font-size: 1.2rem; }
  </style>
</head>
<body>

<div class="header">🏠 ยำร่วมจิตร</div>

<div id="content">
  <div style="text-align:center; padding:50px; color:#999;">กำลังโหลดเมนู...</div>
</div>

<div class="cart-btn">
  <div>รวม <b id="cCount">0</b> รายการ: <b id="cSum">0</b>.-</div>
  <button class="order-now" onclick="sendOrder()">สั่งเลย 🚀</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let cart = [];

  async function load() {
    try {
      const snap = await getDocs(collection(db, "menus"));
      let all = []; snap.forEach(d => all.push({ ...d.data(), id: d.id }));
      
      let html = '';
      
      // ส่วนเมนูแนะนำ
      const recItems = all.filter(m => m.isRecommended);
      if(recItems.length > 0) {
        html += '<div class="section-title">🌟 เมนูแนะนำ</div><div class="grid">';
        recItems.forEach(m => html += itemUI(m));
        html += '</div>';
      }

      // ส่วนหมวดหมู่ปกติ
      let cats = [...new Set(all.map(m => m.category))];
      cats.forEach(c => {
        html += `<div class="section-title">📁 ${c}</div><div class="grid">`;
        all.filter(m => m.category === c).forEach(m => html += itemUI(m));
        html += '</div>';
      });
      
      document.getElementById('content').innerHTML = html;
    } catch (e) {
      document.getElementById('content').innerHTML = '<div style="text-align:center; padding:50px; color:red;">โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่</div>';
    }
  }

  function itemUI(m) {
    return `
      <div class="item" id="item-${m.id}" onclick="add('${m.id}', '${m.name}', ${m.price})">
        <img src="${m.imageUrl}">
        <div class="name">${m.name}</div>
        <div class="price">${m.price}.-</div>
        <button class="btn-add-small">สั่ง</button>
      </div>`;
  }

  window.add = (id, n, p) => {
    // เพิ่มข้อมูลลงตะกร้า
    cart.push({n, p});
    
    // อัปเดตตัวเลขรวมในแถบด้านล่าง
    document.getElementById('cCount').innerText = cart.length;
    document.getElementById('cSum').innerText = cart.reduce((a, b) => a + b.p, 0).toLocaleString();
    
    // เปลี่ยนสีพื้นหลังเมนูที่ถูกเลือก (เพิ่มคลาส .selected)
    // ใช้ querySelectorAll เผื่อเมนูเดียวกันปรากฏทั้งใน "เมนูแนะนำ" และ "หมวดหมู่ปกติ"
    const elements = document.querySelectorAll(`[id="item-${id}"]`);
    elements.forEach(el => el.classList.add('selected'));
  };

  window.sendOrder = async () => {
    if(!cart.length) return alert("กรุณาเลือกอาหารก่อนสั่งครับ");
    
    const btn = document.querySelector('.order-now');
    btn.disabled = true;
    btn.innerText = "กำลังสั่ง...";

    try {
      await addDoc(collection(db, "orders"), {
        items: cart.map(i => i.n),
        total: cart.reduce((a, b) => a + b.p, 0),
        status: 'pending',
        createdAt: serverTimestamp()
      });
      
      alert("ส่งออเดอร์เรียบร้อยแล้ว! ขอบคุณที่ใช้บริการครับ 🙏");
      
      // เคลียร์ตะกร้าและสถานะหน้าจอ
      cart = [];
      document.getElementById('cCount').innerText = "0";
      document.getElementById('cSum').innerText = "0";
      document.querySelectorAll('.item.selected').forEach(el => el.classList.remove('selected'));
      
    } catch (e) {
      alert("เกิดข้อผิดพลาดในการสั่งอาหาร: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "สั่งเลย 🚀";
    }
  };

  load();
</script>
</body>
</html>
