<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Admin - จัดการร้านยำร่วมจิตร</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Mali', cursive; background: #f0f2f5; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #FF5722; border-bottom: 2px solid #FF5722; padding-bottom: 10px; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Mali'; }
    .checkbox-group { display: flex; align-items: center; margin-bottom: 15px; gap: 10px; }
    .checkbox-group input { width: auto; margin: 0; }
    button { background: #FF5722; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    .edit-btn { background: #FFC107; color: black; width: auto; padding: 5px 15px; }
    .delete-btn { background: #f44336; color: white; width: auto; padding: 5px 15px; margin-left: 5px; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    .menu-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 15px; }
  </style>
</head>
<body>
<div class="container">
  <h2 id="formTitle">🍳 จัดการรายการอาหาร</h2>
  <form id="menuForm">
    <select id="categorySelect" required><option value="">กำลังโหลดหมวดหมู่...</option></select>
    <input type="text" id="newCategoryInput" placeholder="ชื่อหมวดหมู่ใหม่ (ถ้ามี)" style="display:none;">
    <input type="text" id="name" placeholder="ชื่ออาหาร" required>
    <input type="number" id="price" placeholder="ราคา (บาท)" required>
    <div class="checkbox-group">
      <input type="checkbox" id="isRecommended"> <label for="isRecommended">🌟 ตั้งเป็นเมนูแนะนำ</label>
    </div>
    <input type="file" id="imageFile" accept="image/*">
    <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    <button type="button" id="cancelBtn" style="display:none; background:#999;">ยกเลิก</button>
  </form>

  <div id="menuList"><h3>รายการทั้งหมด</h3><div id="listContainer">กำลังโหลด...</div></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBCR9k_D1GiVugnFqsIxf33Ge96rCmhbZs",
    authDomain: "signage-eac53.firebaseapp.com",
    projectId: "signage-eac53",
    storageBucket: "signage-eac53.firebasestorage.app",
    messagingSenderId: "184834384558",
    appId: "1:184834384558:web:227f079ed8c161ca36c33f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const CLOUD_NAME = "dk0ypev4m"; 
  const UPLOAD_PRESET = "khonkaen_preset";

  let editingId = null;
  let currentImageUrl = '';

  async function loadMenus() {
    const snap = await getDocs(collection(db, "menus"));
    const cats = new Set();
    let html = '';
    snap.forEach(d => {
      const m = d.data(); cats.add(m.category);
      html += `<div class="menu-item">
        <div style="display:flex;align-items:center;"><img src="${m.imageUrl}">
        <div><b>${m.name}</b> ${m.isRecommended ? '⭐':''}<br><small>${m.category} | ${m.price}.-</small></div></div>
        <div>
          <button class="edit-btn" onclick="editItem('${encodeURIComponent(JSON.stringify({...m, id:d.id}))}')">แก้ไข</button>
          <button class="delete-btn" onclick="deleteItem('${d.id}')">ลบ</button>
        </div>
      </div>`;
    });
    document.getElementById('listContainer').innerHTML = html;
    let catHtml = '<option value="" disabled selected>-- เลือกหมวดหมู่ --</option>';
    cats.forEach(c => catHtml += `<option value="${c}">${c}</option>`);
    catHtml += '<option value="NEW">+ เพิ่มหมวดหมู่ใหม่</option>';
    document.getElementById('categorySelect').innerHTML = catHtml;
  }

  window.editItem = (str) => {
    const data = JSON.parse(decodeURIComponent(str));
    editingId = data.id; currentImageUrl = data.imageUrl;
    document.getElementById('name').value = data.name;
    document.getElementById('price').value = data.price;
    document.getElementById('categorySelect').value = data.category;
    document.getElementById('isRecommended').checked = data.isRecommended || false;
    document.getElementById('submitBtn').innerText = "อัปเดตข้อมูล";
    document.getElementById('cancelBtn').style.display = "block";
  };

  window.deleteItem = async (id) => { if(confirm('ยืนยันการลบ?')) { await deleteDoc(doc(db, "menus", id)); loadMenus(); } };

  document.getElementById('categorySelect').onchange = function() { 
    document.getElementById('newCategoryInput').style.display = this.value === 'NEW' ? 'block' : 'none'; 
  };

  document.getElementById('menuForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn'); btn.disabled = true;
    const file = document.getElementById('imageFile').files[0];
    const category = document.getElementById('categorySelect').value === 'NEW' ? document.getElementById('newCategoryInput').value : document.getElementById('categorySelect').value;
    
    try {
      let url = currentImageUrl;
      if (file) {
        const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
        const d = await res.json(); url = d.secure_url;
      }
      const payload = { 
        name: document.getElementById('name').value, 
        price: parseInt(document.getElementById('price').value), 
        category, imageUrl: url, 
        isRecommended: document.getElementById('isRecommended').checked 
      };
      if (editingId) await updateDoc(doc(db, "menus", editingId), payload);
      else await addDoc(collection(db, "menus"), { ...payload, createdAt: serverTimestamp() });
      
      alert("สำเร็จ!"); location.reload();
    } catch (e) { alert(e.message); btn.disabled = false; }
  };

  loadMenus();
</script>
</body>
</html>
